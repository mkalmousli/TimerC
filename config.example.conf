# Timer_C configuration file
#
# Format: key = value   (one per line)
#   - Lines starting with '#' are comments.
#   - Blank lines are ignored.
#   - Unknown keys are logged and ignored.
#   - Out-of-range values are clamped to the nearest valid value
#     and a warning is logged.
#   - This file is only read at startup; restart the app to pick
#     up changes.
#
# Every key below is shown set to its default. Uncomment the
# "Example" line (or just edit the value) to change it.

# alarm.volume_percent
#   System output volume (%) applied right before the alarm sound
#   starts. This is the ONLY setting in the whole program that ever
#   changes your system/master volume; it is never touched at any
#   other time (not on launch, not for cues, not while idle).
#   Range: 0 to 100   Default: 40
#   Example: alarm.volume_percent = 70
alarm.volume_percent = 40

# alarm.ramp_seconds
#   How many seconds the alarm takes to fade in from near-silent to
#   full volume once it starts. 0 = full volume immediately.
#   Range: 0 to 60   Default: 10
#   Example: alarm.ramp_seconds = 5
alarm.ramp_seconds = 10

# alarm.period_seconds
#   Base length, in seconds, of one repeat of the alarm's musical
#   motif before the tempo starts accelerating.
#   Range: 0.2 to 10   Default: 2.4
#   Example: alarm.period_seconds = 3.0
alarm.period_seconds = 2.4

# alarm.period_min_seconds
#   The fastest (shortest) the motif period is allowed to ramp down
#   to as the alarm gets more urgent. Must be <= alarm.period_seconds
#   (it is clamped down to it automatically if not).
#   Range: 0.05 to 10   Default: 0.8
#   Example: alarm.period_min_seconds = 1.0
alarm.period_min_seconds = 0.8

# alarm.accel
#   How fast the alarm's tempo ramps up, in period-speedup per
#   second of alerting. 0 = tempo never accelerates.
#   Range: 0 to 5   Default: 0.06
#   Example: alarm.accel = 0.1
alarm.accel = 0.06

# alarm.aggro_seconds
#   Seconds for the alarm's loudness/brightness to build from its
#   starting level up to full intensity.
#   Range: 1 to 600   Default: 80
#   Example: alarm.aggro_seconds = 45
alarm.aggro_seconds = 80

# alarm.max_seconds
#   Auto-mute the alarm after this many seconds if nobody dismisses
#   it. Prevents it from ringing forever when you're away.
#   Range: 10 to 3600   Default: 120
#   Example: alarm.max_seconds = 300
alarm.max_seconds = 120

# window.config_width
#   Width in pixels of the config (setup) window.
#   Range: 300 to 2000   Default: 500
#   Example: window.config_width = 560
window.config_width = 500

# window.config_height
#   Height in pixels of the config (setup) window.
#   Range: 300 to 2000   Default: 760
#   Example: window.config_height = 820
window.config_height = 760

# window.mini_width
#   Default width in pixels of the small floating countdown window.
#   Range: 100 to 1000   Default: 250
#   Example: window.mini_width = 300
window.mini_width = 250

# window.mini_height
#   Default height in pixels of the small floating countdown window
#   when it has no 'until' clock shown.
#   Range: 60 to 600   Default: 130
#   Example: window.mini_height = 150
window.mini_height = 130

# window.mini_height_with_until
#   Default height in pixels of the mini window when it also shows
#   an 'until HH:MM' clock.
#   Range: 60 to 600   Default: 172
#   Example: window.mini_height_with_until = 190
window.mini_height_with_until = 172

# window.mini_min_width
#   Smallest width the mini window can be resized down to. Clamped
#   to window.mini_width if larger.
#   Range: 80 to 1000   Default: 130
#   Example: window.mini_min_width = 150
window.mini_min_width = 130

# window.mini_min_height
#   Smallest height the mini window can be resized down to. Clamped
#   to window.mini_height if larger.
#   Range: 40 to 600   Default: 72
#   Example: window.mini_min_height = 90
window.mini_min_height = 72

# window.resize_zone
#   Size in pixels of the draggable corner hit-zone used to resize
#   the mini window.
#   Range: 4 to 64   Default: 22
#   Example: window.resize_zone = 16
window.resize_zone = 22

# tick.config_ms
#   Minimum milliseconds between redraws while the config window is
#   idle (not animating). Lower = smoother, higher = less CPU.
#   Range: 16 to 5000   Default: 500
#   Example: tick.config_ms = 250
tick.config_ms = 500

# tick.config_anim_ms
#   Milliseconds between redraws while the config window's clock/
#   quote animation is running (~1000/fps). 16 ~= 60fps, 33 ~= 30fps.
#   Range: 8 to 1000   Default: 16
#   Example: tick.config_anim_ms = 33
tick.config_anim_ms = 16

# tick.run_ms
#   Milliseconds between redraws while a timer is running normally.
#   Range: 16 to 5000   Default: 1000
#   Example: tick.run_ms = 500
tick.run_ms = 1000

# tick.last10_ms
#   Milliseconds between redraws during the final 10 seconds of a
#   running timer, for a smoother countdown.
#   Range: 16 to 1000   Default: 100
#   Example: tick.last10_ms = 50
tick.last10_ms = 100

# tick.paused_ms
#   Milliseconds between redraws while a timer is paused.
#   Range: 16 to 5000   Default: 1000
#   Example: tick.paused_ms = 500
tick.paused_ms = 1000

# tick.alert_ms
#   Milliseconds between redraws while the alarm is alerting
#   (controls the beat-synced strobe smoothness, ~1000/fps).
#   Range: 8 to 1000   Default: 16
#   Example: tick.alert_ms = 33
tick.alert_ms = 16

# startup.theme
#   Theme used on launch: -1 picks one at random, otherwise an index
#   0..N (see THEMES in draw.c for what each index looks like).
#   Range: -1 to 3   Default: -1
#   Example: startup.theme = 0
startup.theme = -1

# startup.pausable
#   Whether new timers are pausable by default (0 or 1). Same effect
#   as always passing -p on the command line.
#   Range: 0 or 1   Default: 0
#   Example: startup.pausable = 1
startup.pausable = 0

# startup.fullscreen
#   Whether new timers start in fullscreen by default (0 or 1). Same
#   effect as always passing -f on the command line.
#   Range: 0 or 1   Default: 0
#   Example: startup.fullscreen = 1
startup.fullscreen = 0

alarm.volume_percent = 500
bogus.key = 1
