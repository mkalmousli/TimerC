name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Existing tag to (re)build, e.g. v1.0.0', required: true }
permissions: { contents: write }

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds use Debian 11 (glibc 2.31) so they run on nearly every distro
          - { target: x86_64,  platform: linux/amd64,  image: 'debian:bullseye', libc: glibc, deb: amd64 }
          - { target: i686,    platform: linux/386,    image: 'debian:bullseye', libc: glibc, deb: i386 }
          - { target: aarch64, platform: linux/arm64,  image: 'debian:bullseye', libc: glibc, deb: arm64 }
          - { target: armv7,   platform: linux/arm/v7, image: 'debian:bullseye', libc: glibc, deb: armhf }
          # musl builds for Alpine / Void-musl and friends
          - { target: x86_64,  platform: linux/amd64,  image: 'alpine:3.20', libc: musl }
          - { target: aarch64, platform: linux/arm64,  image: 'alpine:3.20', libc: musl }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: docker/setup-qemu-action@v3
      - name: Build in container
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src \
            -e VERSION="${TAG#v}" -e TARGET=${{ matrix.target }} -e LIBC=${{ matrix.libc }} \
            -e DEB_ARCH=${{ matrix.deb }} ${{ matrix.image }} sh packaging/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}-${{ matrix.libc }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
