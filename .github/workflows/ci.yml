name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  ubuntu:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxft-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libfontconfig1-dev libsqlite3-dev xvfb ${{ matrix.cc == 'clang' && 'clang' || '' }}
      - run: make CC=${{ matrix.cc }}
      - name: Smoke test
        run: |
          ./timerc --version
          ./timerc --help
          xvfb-run -a sh -c './timerc-bg 2s smoke; sleep 1; pgrep -x timerc-bg'

  other-distros:
    strategy:
      fail-fast: false
      matrix:
        image: [fedora:latest, archlinux:latest, alpine:latest, opensuse/tumbleweed]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build via install.sh dependency logic
        run: |
          (command -v apk && apk add --no-cache sudo curl) || true
          ./install.sh
